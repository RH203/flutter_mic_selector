name: flutter_mic_selector_example
description: "Demonstrates how to use the flutter_mic_selector plugin."
publish_to: 'none'

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_mic_selector:
    path: ../

  cupertino_icons: ^1.0.8
  record: ^5.2.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
